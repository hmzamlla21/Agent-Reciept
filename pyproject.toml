[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipts"
version = "0.1.0"
description = "A plain-English receipt of what your AI coding agent did: commands run, files changed, risky actions, and whether tests ran. Works with Claude Code, Codex CLI, Gemini CLI and OpenCode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hamza" }]
keywords = ["ai", "coding-agent", "claude-code", "codex", "gemini-cli", "opencode", "audit", "receipt", "session", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
agent-receipts = "agent_receipts.cli:main"

[project.urls]
Homepage = "https://github.com/hmzamlla21/agent-reciept"
Issues = "https://github.com/hmzamlla21/agent-reciept/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_receipts = ["integrations/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
