name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Run the tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the installed command
        run: |
          agent-receipts --version
          agent-receipts --agent claude-code --dir examples/logs/claude-code --no-color
          agent-receipts --agent codex --dir examples/logs/codex --format json -o -
